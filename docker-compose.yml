services:

  storage_service:
    build: ./storage_service
    container_name: tpp_storage_service
    ports:
      - "8004:8000"
    env_file:
      - ./storage_service/.env
    networks:
      - tpp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/storage/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tpp-net:
    external: true
    name: tpp-net
