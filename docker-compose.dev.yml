services:

  storage_service:
    build: ./storage_service
    container_name: storage_service
    ports:
      - "8004:8000"
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/storage/livez" ]
      interval: 30s
      timeout: 5s
      retries: 3
